title: Thicket UI — Jekyll Component Garden
description: Thicket UI fixture for jekyll-component-mcp
url: ""
baseurl: ""

markdown: kramdown
highlighter: rouge

permalink: pretty
lang: en

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .jekyll-mcp.json

sass:
  sass_dir: assets/scss
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      layout: default
