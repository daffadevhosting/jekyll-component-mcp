<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' | escape }}" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url | escape }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/thicket-mark.svg' | relative_url | escape }}">
</head>
<body>
  <a href="#main-content" class="c-skip-link">Skip to main content</a>
  {% include components/navbar.html %}
  <main id="main-content" class="l-main" tabindex="-1">
    {{ content }}
  </main>
  {% include partials/footer.html %}
  {% include components/toast.html %}
  <script type="module" src="{{ '/assets/js/main.js' | relative_url | escape }}"></script>
</body>
</html>
